name: Build GRoupCoza

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept SDK Licenses and Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Setup Gradle
        run: |
          cd android
          gradle init --type basic --dsl groovy --project-name GRoupCoza --no-incubating 2>/dev/null || true
          gradle wrapper --gradle-version 8.2 --no-daemon 2>/dev/null || true
          ls -la

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GRoupCoza-android
          path: android/app/build/outputs/apk/release/*.apk
